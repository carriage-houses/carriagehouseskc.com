<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}Carriage Houses of Johnson County Newsletter{% endif %}</title>
  <meta name="color-scheme" content="light">
  <style>
    @media only screen and (max-width: 600px) {
      .email-outer-td { padding: 0 !important; }
      .email-header-td { padding: 20px 16px !important; }
      .email-content-td { padding: 20px 16px !important; }
      .email-footer-td { padding: 16px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#333333;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
  <tr>
    <td align="center" class="email-outer-td" style="padding:20px 0;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;">

        <!-- Header -->
        <tr>
          <td class="email-header-td" style="background-color:#1a2340;padding:24px 32px;border-bottom:4px solid #b8972a;text-align:center;">
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.05em;">Carriage Houses of Johnson County</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:rgba(255,255,255,0.65);margin-top:5px;letter-spacing:0.08em;text-transform:uppercase;">Member Newsletter{% if page.date %} &nbsp;&middot;&nbsp; {{ page.date | date: "%B %Y" }}{% endif %}</div>
          </td>
        </tr>

        <!-- Content -->
        <tr>
          <td class="email-content-td" style="padding:32px 36px;">
            {{ content }}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td class="email-footer-td" style="background-color:#1a2340;padding:20px 32px;text-align:center;border-top:4px solid #b8972a;">
            <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:rgba(255,255,255,0.7);margin:0 0 6px 0;">
              <a href="https://carriagehouseskc.com" style="color:rgba(255,255,255,0.85);text-decoration:none;">carriagehouseskc.com</a>
              &nbsp;&middot;&nbsp;
              <a href="https://www.facebook.com/groups/chdesoto" style="color:rgba(255,255,255,0.85);text-decoration:none;">Find us on Facebook</a>
            </p>
            <p style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:rgba(255,255,255,0.45);margin:0;">
              Copyright &copy; 2026 Carriage Houses of Johnson County LLC &mdash; All Rights Reserved.
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
