<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<nav>
  <a class="nav-brand" href="{{ '/' | relative_url }}">Carriage Houses of Johnson County</a>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
    <li><a href="{{ '/photo-gallery/' | relative_url }}"{% if page.url contains 'photo-gallery' %} class="active"{% endif %}>Photo Gallery</a></li>
    <li><a href="{{ '/about/' | relative_url }}"{% if page.url contains 'about' %} class="active"{% endif %}>About</a></li>
    <li><a href="{{ '/owner-information/' | relative_url }}"{% if page.url contains 'owner-information' %} class="active"{% endif %}>Owner Information</a></li>
  </ul>
</nav>

{{ content }}

<footer>
  <div class="footer-links">
    <a href="{{ '/photo-gallery/' | relative_url }}">Photo Gallery</a>
    <a href="https://www.facebook.com/groups/chdesoto" target="_blank" rel="noopener">Find us on Facebook</a>
  </div>
  <p>Copyright &copy; 2026 Carriage Houses of Johnson County LLC &mdash; All Rights Reserved.</p>
</footer>

</body>
</html>
